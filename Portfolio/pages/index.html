<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geovanna Santos — Portfólio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="../styles/style.css">

</head>
<body>

    <!-- Topbar estilo -->
    <div id="topbar">
        <div class="tb-center">
            <span id="today"></span>
        </div>
        <div class="tb-right">
            <button id="dm-toggle" aria-label="alternar tema">
                <img id="dock-icon" src="/Portfolio/img/sun-bold.svg" alt="ícone de alternar tema" width="20" height="20">
            </button>
            <button id="useless" class="dock-toggle dock-item" data-modal="uselessModal" aria-label="useless button">
                <img id="useless-icon" src="/Portfolio/img/question-mark-bold (3).svg" alt="" width="20" height="20">
            </button>
        </div>  
    </div>

    <!-- Desktop principal -->
    <main id="desktop" role="main">

        <!-- Mensagem inicial -->
        <div class="welcome-card" id="welcome">
            <p class="welcome-eyebrow">Bem-vindo ao meu portfólio!</p>
            <h1 class="welcome-title">Olá! Sou a <em>Geovanna Santos</em></h1>
            <p class="welcome-sub">Escolha uma aba abaixo para conhecer mais sobre mim ↓</p>
            <div class="welcome-cursor"></div>
        </div>

        <!-- Container onde as janelas são renderizadas -->
        <div id="windows-container"></div>

    </main>

    <!-- Dock de navegação -->
    <nav id="dock" aria-label="Menu principal">
        <button class="dock-item" data-modal="aboutModal" aria-label="Abrir sobre mim">
            <span class="dock-icon">★</span>
            <span class="dock-label">Sobre mim</span>
            <span class="dock-dot"></span>
        </button>
        <button class="dock-item" data-modal="projectsModal" aria-label="Abrir projetos">
            <span class="dock-icon">✻</span>
            <span class="dock-label">Projetos</span>
            <span class="dock-dot"></span>
        </button>
        <button class="dock-item" data-modal="linksModal" aria-label="Abrir links">
            <span class="dock-icon">✦</span>
            <span class="dock-label">Links</span>
            <span class="dock-dot"></span>
        </button>
        <button class="dock-item" data-modal="contactModal" aria-label="Abrir contato">
            <span class="dock-icon">✉</span>
            <span class="dock-label">Contato</span>
            <span class="dock-dot"></span>
        </button>
    </nav>

    <!-- Conteúdo dos modais e templates base-->
    <template id="tpl-uselessModal">
        <div class="win-section">
            <p id="fato" class="project-card"></p>
        </div>
    </template>
    <template id="tpl-aboutModal">
        <div class="win-section about-grid">
            <div class="about-avatar" id="about-avatar">GS</div>
            <div class="about-info">
                <p id="name" class="profile-name"></p>
                <p id="jobTitle" class="profile-title"></p>
            </div>
        </div>
        <div class="win-divider"></div>
        <p id="bio" class="profile-bio win-section"></p>
        <div class="win-divider"></div>
        <div class="win-section">
            <p class="win-label">habilidades</p>
            <div id="skills" class="skills-wrap"></div>
        </div>
        <div class="win-divider"></div>
        <section class="win-section time-info" aria-label="Informações de tempo">
            <p id="gradYear"></p>
            <p id="timeElapsed"></p>
            <p id="completionRate"></p>
            <p id="timeLeft"></p>
        </section>
    </template>

    <template id="tpl-projectsModal">
        <div class="win-section">
            <div id="projects" class="projects-list"></div>
        </div>
    </template>

    <template id="tpl-linksModal">
        <div class="win-section">
            <div id="linkList" class="links-grid"></div>
        </div>
    </template>

    <template id="tpl-contactModal">
        <div class="win-section">
            <p class="win-label">Converse comigo pelo Email!</p>
            <div id="contactList" class="contact-list"></div>
        </div>
    </template>

    <script type="module" src="../scripts/script.js"></script>
    <script type="module" src="../scripts/api.js"></script>
</body>
</html>
